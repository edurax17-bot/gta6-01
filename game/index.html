<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar City — Harbor Heist</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0c1420; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #fallback { position: fixed; inset: 0; display: none; place-items: center; color: #ffd9a0;
    font: 16px/1.5 system-ui, sans-serif; text-align: center; padding: 24px; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800" aria-label="Solmar City: an open-world crime game. Drive, steal cars, outrun the police and finish the story missions."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<div id="fallback">Solmar City needs JavaScript and a modern desktop browser to play.</div>
<script type="module" src="./src/main.js"></script>
<script>
  window.addEventListener('error', function () {
    document.getElementById('fallback').style.display = 'grid';
  }, true);
</script>
</body>
</html>
